# Hält das Supabase-Projekt aktiv.
#
# Der Free-Plan pausiert Projekte, die 7 Tage lang keine Datenbank-Aktivität sehen.
# Eine Abfrage pro Tag reicht, um den Inaktivitäts-Timer zurückzusetzen.
#
# URL und Key stehen bewusst im Klartext: beide werden ohnehin in sb.js an jeden
# Besucher ausgeliefert. Der Schutz kommt allein aus den RLS-Policies (setup-database.sql).

name: Supabase Keep-Alive

on:
  schedule:
    - cron: '17 6 * * *'   # täglich um 06:17 UTC
  workflow_dispatch:        # erlaubt manuelles Auslösen im Actions-Tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase anpingen
        env:
          SUPABASE_URL: https://mmzggnwshgjqruebqaru.supabase.co
          SUPABASE_KEY: sb_publishable_-G2zwCs25OSoB6jY8nqBTw_Rayz45MA
        run: |
          # Bei pausiertem Projekt entfällt sogar der DNS-Eintrag, dann scheitert curl
          # selbst (Exit 6). Deshalb den Exit-Code abfangen statt den Job hart abbrechen
          # zu lassen – so steht eine verständliche Meldung im Log.
          code=$(curl -sS -o response.txt -w '%{http_code}' \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/variants?select=id&limit=1") || curl_failed=1

          if [ -n "$curl_failed" ]; then
            echo "::error::Supabase war nicht erreichbar (Netzwerk-/DNS-Fehler) – Projekt vermutlich pausiert."
            exit 1
          fi

          echo "HTTP $code"
          cat response.txt

          if [ "$code" != "200" ]; then
            echo "::error::Supabase antwortet nicht wie erwartet (HTTP $code)."
            exit 1
          fi

          echo "Supabase ist erreichbar."
