<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="icon" href="favicon.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Anmeldung – Honig aus Hochkamp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="sb.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#F5F0EB',
            honey: '#B8862A',
            ink:   '#1A1A1A',
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans:  ['"DM Sans"', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background-color: #F5F0EB; color: #1A1A1A; }
    input:focus { outline: none; border-color: #B8862A; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center px-4">

  <!-- Logo -->
  <a href="index.html" class="mb-8">
    <div class="w-16 h-16 rounded-full overflow-hidden shadow-sm">
      <img src="aktive-fotos-website/Logo neu.jpg" alt="Logo" style="width:100%;height:100%;object-fit:cover;">
    </div>
  </a>

  <!-- Card -->
  <div class="bg-white border border-gray-200 rounded-2xl p-10 w-full" style="max-width:420px;">

    <p class="text-honey text-[11px] tracking-[0.2em] uppercase mb-3 font-sans text-center">Geschützter Bereich</p>
    <h1 class="font-serif font-normal text-ink text-2xl text-center mb-8">Admin Anmeldung</h1>

    <form id="login-form" novalidate>

      <!-- Username -->
      <div class="mb-4">
        <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-2">E-Mail</label>
        <input
          type="email"
          id="username"
          placeholder="E-Mail-Adresse eingeben"
          class="w-full border border-gray-300 rounded-full px-5 py-3 text-sm bg-cream transition-colors"
          autocomplete="email"
        >
      </div>

      <!-- Password -->
      <div class="mb-8">
        <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-2">Passwort</label>
        <div class="relative">
          <input
            type="password"
            id="password"
            placeholder="Passwort eingeben"
            class="w-full border border-gray-300 rounded-full pl-5 pr-12 py-3 text-sm bg-cream transition-colors"
            autocomplete="current-password"
          >
          <button
            type="button"
            id="toggle-password"
            aria-label="Passwort anzeigen"
            tabindex="-1"
            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-honey transition-colors"
          >
            <!-- Auge (Passwort verborgen) -->
            <svg id="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <!-- Durchgestrichenes Auge (Passwort sichtbar) -->
            <svg id="eye-off" class="hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 8 10 8a13.16 13.16 0 0 1-1.67 2.68"></path>
              <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
              <path d="M9.9 14.1A3 3 0 0 1 14.12 9.88"></path>
              <line x1="2" y1="2" x2="22" y2="22"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Error -->
      <div id="login-error" class="hidden rounded-xl p-4 mb-6 border text-center"
        style="background:rgba(220,38,38,0.05); border-color:rgba(220,38,38,0.25);">
        <p class="text-sm font-medium" style="color:#b91c1c;">
          Falscher Benutzername oder falsches Passwort.
        </p>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="w-full bg-honey text-white text-sm font-sans font-medium py-4 rounded-full hover:opacity-90 transition-opacity"
        style="letter-spacing:0.02em;"
      >
        Anmelden →
      </button>

    </form>

  </div>

  <!-- Back link -->
  <a href="index.html" class="mt-8 text-gray-400 text-xs hover:text-gray-600 transition-colors">
    ← Zurück zur Website
  </a>

  <script>
    // Redirect if already logged in
    sb.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = 'admin-dashboard.html';
    });

    // Input focus style
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('focus', () => input.style.borderColor = '#B8862A');
      input.addEventListener('blur',  () => input.style.borderColor = '');
    });

    // Passwort anzeigen / verbergen
    document.getElementById('toggle-password').addEventListener('click', () => {
      const pw     = document.getElementById('password');
      const eyeOn  = document.getElementById('eye-open');
      const eyeOff = document.getElementById('eye-off');
      const btn    = document.getElementById('toggle-password');
      const show   = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      eyeOn.classList.toggle('hidden', show);
      eyeOff.classList.toggle('hidden', !show);
      btn.setAttribute('aria-label', show ? 'Passwort verbergen' : 'Passwort anzeigen');
    });

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('username').value.trim();
      const pass  = document.getElementById('password').value;
      const err   = document.getElementById('login-error');
      const btn   = e.submitter;

      btn.disabled = true;
      btn.textContent = 'Anmelden …';

      const { error } = await sb.auth.signInWithPassword({ email, password: pass });

      if (error) {
        err.classList.remove('hidden');
        document.getElementById('password').value = '';
        btn.disabled = false;
        btn.textContent = 'Anmelden →';
      } else {
        window.location.href = 'admin-dashboard.html';
      }
    });
  </script>

</body>
</html>
